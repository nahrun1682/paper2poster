<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Poster HTML Template</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e5e7eb;
        color: #111827;
        font-family: "IPAPGothic", "IPA Pゴシック", "Noto Sans CJK JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, ui-sans-serif, system-ui, sans-serif;
      }

      .poster-canvas {
        position: relative;
        container-type: inline-size;
        width: min(100vw, calc(100vh * 0.706922));
        aspect-ratio: 6858000 / 9701213;
        background: #f8fafc;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.22);
        overflow: hidden;
      }

      .poster-element {
        position: absolute;
        overflow: hidden;
        border: 1px solid rgba(17, 24, 39, 0.28);
        padding: clamp(1px, 0.55cqw, 10px);
        line-height: 1.25;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .poster-element.image {
        display: grid;
        place-items: center;
        padding: 0;
        background: transparent;
      }

      .poster-element.section-heading {
        display: flex;
        align-items: center;
        padding: 0 clamp(2px, 0.8cqw, 12px);
        line-height: 1;
        font-weight: 700;
      }

      .poster-element.poster-title {
        display: flex;
        align-items: center;
        padding: 0 clamp(2px, 0.65cqw, 10px);
        line-height: 1.05;
        font-weight: 700;
      }

      .poster-element img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>

    <script>
      function fitPosterText() {
        const elements = document.querySelectorAll(".poster-element.text:not(.poster-title):not(.section-heading)");
        for (const element of elements) {
          const style = window.getComputedStyle(element);
          let size = parseFloat(style.fontSize);
          const minSize = 10;
          while (size > minSize && element.scrollHeight > element.clientHeight) {
            size -= 0.5;
            element.style.fontSize = size + "px";
          }
        }
      }

      window.addEventListener("load", () => {
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(fitPosterText);
        } else {
          fitPosterText();
        }
      });
      window.addEventListener("resize", fitPosterText);
    </script>
